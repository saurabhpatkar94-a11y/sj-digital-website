<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" height="170">
  <!-- SJ in orange italic serif -->
  <text x="8" y="145"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="138"
        font-style="italic"
        font-weight="700"
        fill="#E8821A">SJ</text>

  <!-- Diamond gem icon above J -->
  <!-- Sparkle lines -->
  <line x1="103" y1="2"  x2="103" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="95"  y1="5"  x2="100" y2="11" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="111" y1="5"  x2="106" y2="11" stroke="white" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Diamond outline -->
  <polygon points="103,18 123,32 103,50 83,32"
           fill="none" stroke="white" stroke-width="1.8"/>
  <!-- Diamond facet lines -->
  <polyline points="83,32 103,27 123,32" fill="none" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="103" y1="18" x2="103" y2="27" stroke="white" stroke-width="1.2" opacity="0.7"/>
  <line x1="83"  y1="32" x2="103" y2="50" stroke="white" stroke-width="1.2" opacity="0.5"/>
  <line x1="123" y1="32" x2="103" y2="50" stroke="white" stroke-width="1.2" opacity="0.5"/>

  <!-- DIGITAL in white serif -->
  <text x="158" y="145"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="118"
        font-weight="700"
        fill="white"
        letter-spacing="2">DIGITAL</text>
</svg>
